services:
  pizza_sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vesuvio_sql_server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Copie .env.example para .env e defina MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - vesuvio_sqlserver_data:/var/opt/mssql

volumes:
  vesuvio_sqlserver_data:
